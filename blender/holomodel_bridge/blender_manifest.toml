schema_version = "1.0.0"

id = "holomodel_bridge"
version = "0.3.0"
name = "Holo Modeler Bridge"
tagline = "Lets the Holo Modeler app build and edit models in this Blender"
maintainer = "TC-al"
type = "add-on"
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Listens on this computer only, for the Holo Modeler app"
files = "Writes its connection details, preview renders, and the GLB exports and scene autosaves the app asks for"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]

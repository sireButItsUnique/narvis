<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#35d0ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7cff9b"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb23e"/>
    </marker>
    <style>
      .bg { fill: #04060b; }
      .lane { fill: #07111c; stroke: #143048; }
      .box { fill: #0b1a29; stroke: #1d3b55; }
      .hw { fill: #0e2233; stroke: #2b5a80; }
      .t { fill: #cfe8ff; font-size: 13px; }
      .s { fill: #7fa3bf; font-size: 11px; }
      .h { fill: #35d0ff; font-size: 13px; font-weight: 600; letter-spacing: .4px; }
      .m { fill: #8fd3ff; font-size: 11px; font-family: Consolas, ui-monospace, monospace; }
      .g { fill: #7cff9b; font-size: 11px; }
      .w { fill: #ffb23e; font-size: 11px; }
      .line { stroke: #35d0ff; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .gline { stroke: #7cff9b; stroke-width: 1.6; fill: none; marker-end: url(#ag); }
      .aline { stroke: #ffb23e; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#aa); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="700"/>

  <text class="h" x="24" y="30" font-size="16">Holomodel v3 — how sensor data reaches the app</text>
  <text class="s" x="24" y="50">public/js/input/*. Everything below runs today against synthetic input: a generated side-by-side video and the bridge's --fake mode.</text>

  <!-- lanes -->
  <rect class="lane" x="24" y="68" width="290" height="470" rx="10"/>
  <text class="h" x="40" y="92">SENSORS</text>
  <rect class="lane" x="330" y="68" width="530" height="470" rx="10"/>
  <text class="h" x="346" y="92">CAPTURE (this workflow)</text>
  <rect class="lane" x="876" y="68" width="280" height="470" rx="10"/>
  <text class="h" x="892" y="92">WHAT THE APP READS</text>

  <!-- sensors -->
  <rect class="hw" x="44" y="106" width="250" height="78" rx="8"/>
  <text class="t" x="60" y="128">ZED stereo camera — one USB cable</text>
  <text class="s" x="60" y="146">plain UVC: no SDK, no CUDA needed</text>
  <text class="m" x="60" y="166">2560x720 = LEFT 1280 | RIGHT 1280</text>

  <rect class="hw" x="44" y="198" width="250" height="66" rx="8"/>
  <text class="t" x="60" y="220">1-2 Logitech webcams</text>
  <text class="s" x="60" y="238">watch the head; a spare one aimed at</text>
  <text class="s" x="60" y="254">the hands is the biggest accuracy win</text>

  <rect class="hw" x="44" y="278" width="250" height="96" rx="8"/>
  <text class="w" x="60" y="300">Friend's laptop (NVIDIA + CUDA)</text>
  <text class="s" x="60" y="318">tools/zed-bridge/zed_bridge.py</text>
  <text class="s" x="60" y="334">pyzed + MediaPipe → 21 points in metres</text>
  <text class="m" x="60" y="354">ws:// JSON 60 Hz  ·  --fake: no camera</text>

  <rect class="box" x="44" y="388" width="250" height="60" rx="8"/>
  <text class="t" x="60" y="410">Nothing plugged in</text>
  <text class="s" x="60" y="428">mouse mode: the app still runs</text>

  <!-- capture column 1 -->
  <rect class="box" x="348" y="106" width="200" height="78" rx="8"/>
  <text class="t" x="362" y="128">devices.js</text>
  <text class="s" x="362" y="146">which cameras, which is a ZED</text>
  <text class="s" x="362" y="162">(label, 32:9 frame, or you say so),</text>
  <text class="s" x="362" y="178">who watches head vs hands</text>

  <rect class="box" x="348" y="198" width="200" height="66" rx="8"/>
  <text class="t" x="362" y="220">stereo.js — split</text>
  <text class="s" x="362" y="238">crop each eye out of the one</text>
  <text class="s" x="362" y="254">side-by-side frame (one exposure)</text>

  <rect class="box" x="348" y="278" width="200" height="100" rx="8"/>
  <text class="t" x="362" y="300">landmarks-worker.js  x N</text>
  <text class="s" x="362" y="318">one Web Worker per view:</text>
  <text class="s" x="362" y="334">MediaPipe face + hands, off the</text>
  <text class="s" x="362" y="350">render thread. Classic worker:</text>
  <text class="s" x="362" y="366">MediaPipe will not load in a</text><text class="s" x="362" y="382">module one (measured).</text>

  <rect class="box" x="348" y="398" width="200" height="100" rx="8"/>
  <text class="t" x="362" y="422">frame gate</text>
  <text class="s" x="362" y="440">what a worker is allowed: one</text>
  <text class="s" x="362" y="456">frame in flight, nothing older</text>
  <text class="s" x="362" y="472">than 120 ms, never a queue:</text><text class="s" x="362" y="488">a late hand is worse than none</text>

  <!-- capture column 2 -->
  <rect class="box" x="574" y="106" width="270" height="78" rx="8"/>
  <text class="t" x="588" y="128">timestamps</text>
  <text class="s" x="588" y="146">every result carries the instant it was</text>
  <text class="s" x="588" y="162">captured; two free-running webcams are</text>
  <text class="s" x="588" y="178">interpolated onto one instant before fusing</text>

  <rect class="box" x="574" y="198" width="270" height="96" rx="8"/>
  <text class="t" x="588" y="220">stereo.js — rays</text>
  <text class="s" x="588" y="238">pixel → undistorted ray, using the ZED's</text>
  <text class="s" x="588" y="254">free factory calibration (SN.conf) when</text>
  <text class="s" x="588" y="270">it is there, its published field of view</text>
  <text class="s" x="588" y="286">when it is not</text>

  <rect class="box" x="574" y="308" width="270" height="84" rx="8"/>
  <text class="t" x="588" y="330">solver (thin adapter)</text>
  <text class="s" x="588" y="348">imports ../track/solve.js when it lands,</text>
  <text class="s" x="588" y="364">checks it against a known answer, and</text>
  <text class="s" x="588" y="380">falls back to an N-view midpoint here</text>

  <rect class="box" x="574" y="406" width="270" height="78" rx="8"/>
  <text class="t" x="588" y="428">zed-client.js</text>
  <text class="s" x="588" y="446">bridge socket: clock sync, latency, reconnect</text>
  <text class="s" x="588" y="462">(250 ms → 2 s), metres → cm, stale frames</text>
  <text class="s" x="588" y="478">dropped. Wins while it is fresh.</text>

  <!-- output -->
  <rect class="box" x="892" y="106" width="248" height="150" rx="8"/>
  <text class="t" x="906" y="128">input/state.js — unchanged</text>
  <text class="m" x="906" y="150">input.eye        x y z</text>
  <text class="m" x="906" y="170">input.hands[0..1]</text>
  <text class="m" x="922" y="190">.tip  .grip  .pinch</text>
  <text class="m" x="922" y="210">.jointsWorld (21 x 3)</text>
  <text class="s" x="906" y="234">world cm: origin at the middle of the</text>
  <text class="s" x="906" y="250">display, x right, y up, z toward you</text>

  <rect class="box" x="892" y="270" width="248" height="86" rx="8"/>
  <text class="t" x="906" y="292">interaction / sculpt / rig</text>
  <text class="s" x="906" y="310">read the same fields they read today,</text>
  <text class="s" x="906" y="326">so nothing downstream changes when</text>
  <text class="s" x="906" y="342">the sensors improve</text>

  <rect class="box" x="892" y="372" width="248" height="112" rx="8"/>
  <text class="t" x="906" y="394">public/cameras.html</text>
  <text class="s" x="906" y="412">setup page: each view live with its</text>
  <text class="s" x="906" y="428">landmarks drawn, fps, latency, drops,</text>
  <text class="s" x="906" y="444">who sees head / hands, bridge health —</text>
  <text class="s" x="906" y="460">so the cameras can actually be aimed</text>

  <!-- arrows -->
  <path class="line" d="M294 145 H344"/>
  <path class="line" d="M294 231 H344"/>
  <path class="line" d="M448 184 V194"/>
  <path class="line" d="M448 264 V274"/>
  <path class="line" d="M448 398 V382"/>
  <path class="line" d="M548 330 H570"/>
  <path class="line" d="M709 184 V194"/>
  <path class="line" d="M709 294 V304"/>
  <path class="gline" d="M844 340 H888"/>
  <path class="aline" d="M294 344 C 322 344, 316 520, 420 520 L 540 520 C 564 520, 570 496, 570 452"/>
  <path class="aline" d="M844 440 C 870 440, 878 380, 888 332"/>
  
  
  <path class="gline" d="M1016 256 V266"/>
  <path class="gline" d="M1016 356 V368"/>

  <!-- ladder -->
  <rect class="lane" x="24" y="556" width="1132" height="120" rx="10"/>
  <text class="h" x="40" y="580">IT ALWAYS DEGRADES, IT NEVER STOPS</text>
  <text class="t" x="40" y="604">no camera</text><text class="s" x="140" y="604">→ mouse mode</text>
  <text class="t" x="40" y="624">one webcam</text><text class="s" x="140" y="624">→ webcam.js, exactly today's app (depth guessed from palm and eye spacing) — reused, not rewritten</text>
  <text class="t" x="40" y="644">two webcams</text><text class="s" x="140" y="644">→ the first does everything, the second adds a second view of the hands</text>
  <text class="t" x="40" y="664">a ZED</text><text class="s" x="140" y="664">→ both eyes triangulated, ~4 mm at 50 cm with 1 px of landmark noise; the bridge takes over while it is fresh, and a dead bridge falls back here</text>
</svg>
